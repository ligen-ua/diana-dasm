[pytest]
testpaths = .
addopts = -ra --strict-markers
cache_dir = _out/.pytest_cache
markers =
    pe: uses the ntoskrnl test binary (data/pe/nt.zip)
    elf: uses the ELF test binaries (data/elf)
    process: opens a live process (--pid)
    symbols: loads a PDB
    slow: cold analysis of a large binary
xfail_strict = true
