[pytest]
testpaths = .
addopts = -ra --strict-markers
cache_dir = _out/.pytest_cache
markers =
    pe: opens a PE file (ntoskrnl, or the binary under test on Windows)
    elf: opens an ELF file (data/elf, or the binary under test on Linux)
    private: uses third-party binaries from data/private (gitignored; skipped when absent)
    process: opens a live process (--pid)
    symbols: loads a PDB
    slow: cold analysis of a large binary
xfail_strict = true
